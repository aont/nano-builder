name: Build GNU nano pacman package for MSYS2 UCRT64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-nano-ucrt64.yml"
      - "mingw-w64-nano/**"

permissions:
  contents: write

concurrency:
  group: nano-ucrt64-package
  cancel-in-progress: false

env:
  PACKAGE_DIR: mingw-w64-nano

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-github-cli

      - name: Verify package sources
        run: |
          set -euxo pipefail

          required_files=(
            "${PACKAGE_DIR}/PKGBUILD"
            "${PACKAGE_DIR}/nano-9.2-ucrt64.patch"
          )

          for path in "${required_files[@]}"; do
            if [[ ! -f "${path}" ]]; then
              echo "::error file=${path}::Required package source is missing"
              echo "Repository files:"
              find . -maxdepth 3 -type f -print | sort
              exit 1
            fi
          done

          if ! command -v makepkg-mingw >/dev/null; then
            echo "::error::makepkg-mingw is not available"
            pacman -Q pacman base-devel || true
            pacman -Ql pacman | grep -F makepkg-mingw || true
            exit 1
          fi

          makepkg-mingw --version || true

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            source "${PACKAGE_DIR}/PKGBUILD"
            patch_index=-1

            for i in "${!source[@]}"; do
              source_name="${source[$i]##*::}"
              source_name="${source_name##*/}"
              if [[ "${source_name}" == "nano-9.2-ucrt64.patch" ]]; then
                patch_index="${i}"
                break
              fi
            done

            if (( patch_index < 0 )); then
              echo "::error::Patch is not declared in PKGBUILD source[]"
              exit 1
            fi

            if [[ "${sha256sums[$patch_index]:-}" == "SKIP" ]]; then
              echo "::error::Patch checksum must not be SKIP for a release"
              exit 1
            fi
          fi

      - name: Build pacman package
        id: package
        run: |
          set -euxo pipefail

          cd "${PACKAGE_DIR}"

          # Restrict the build to the target declared by this package.
          MINGW_ARCH=ucrt64 makepkg-mingw \
            --cleanbuild \
            --syncdeps \
            --noconfirm \
            --force

          mapfile -t packages < <(
            find . -maxdepth 1 -type f \
              -name 'mingw-w64-ucrt-x86_64-nano-[0-9]*.pkg.tar.zst' \
              ! -name '*-debug-*' \
              -print
          )

          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one main nano package"
            printf 'Candidate: %s\n' "${packages[@]}"
            exit 1
          fi

          package="${packages[0]}"

          # Read the package release identity from PKGBUILD. pkgrel is the
          # pacman-native rebuild counter and replaces the unrelated 0.0.N tag.
          source ./PKGBUILD
          release_tag="nano-${pkgver}-${pkgrel}"

          sha256sum "${package}" > "${package}.sha256"
          makepkg --printsrcinfo > .SRCINFO

          package="${PACKAGE_DIR}/${package#./}"
          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${package}.sha256" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Inspect and install package
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          set -euxo pipefail

          pacman -Qip "${PACKAGE}"
          pacman -Qlp "${PACKAGE}"

          bsdtar -tf "${PACKAGE}" | grep -Fx 'ucrt64/bin/nano.exe'
          bsdtar -tf "${PACKAGE}" | grep -Fx 'ucrt64/etc/nanorc'

          pacman -U --noconfirm "${PACKAGE}"

          /ucrt64/bin/nano.exe --version
          file /ucrt64/bin/nano.exe
          dlls="$(
            objdump -p /ucrt64/bin/nano.exe \
              | sed -n 's/^[[:space:]]*DLL Name: //p' \
              | sort -u
          )"
          printf '%s\n' "${dlls}"

          if grep -Fqi 'msys-2.0.dll' <<< "${dlls}"; then
            echo "nano.exe is linked to the MSYS runtime, not a native UCRT build." >&2
            exit 1
          fi

          pacman -Qi mingw-w64-ucrt-x86_64-nano

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mingw-w64-ucrt-x86_64-${{ steps.package.outputs.release_tag }}
          path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.checksum }}
            mingw-w64-nano/PKGBUILD
            mingw-w64-nano/.SRCINFO
          if-no-files-found: error
          compression-level: 0

      # Push builds are validation builds. A manually dispatched run publishes
      # the immutable pkgver-pkgrel release after PKGBUILD has been reviewed.
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.package.outputs.package }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          set -euxo pipefail

          if gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; bump pkgrel in PKGBUILD." >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            "${PACKAGE}" \
            "${CHECKSUM}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "GNU ${RELEASE_TAG} for MSYS2 UCRT64" \
            --notes "Pacman package: mingw-w64-ucrt-x86_64-nano"
