name: Build GNU nano for MSYS2 UCRT64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-nano-ucrt64.yml"

permissions:
  contents: read

concurrency:
  group: nano-ucrt64-${{ github.ref }}
  cancel-in-progress: true

env:
  NANO_VERSION: "9.2"
  NANO_SHA256: "05ecb99247b782e8a5b3a25ed4101dd034b0236902f7449bc9795b717642f7e9"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            curl
            make
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-file

      - name: Download, build, and stage nano
        run: |
          set -euxo pipefail

          root="$PWD"
          srcdir="$root/_source"
          stage="$root/_stage"
          package="$root/nano-ucrt64-${NANO_VERSION}"
          archive="nano-${NANO_VERSION}.tar.xz"

          rm -rf "$srcdir" "$stage" "$package"
          mkdir -p "$srcdir"
          cd "$srcdir"

          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://www.nano-editor.org/dist/v9/${archive}"

          printf '%s  %s\n' "$NANO_SHA256" "$archive" \
            | sha256sum --check --strict -

          tar -xf "$archive"
          cd "nano-${NANO_VERSION}"

          ./configure \
            --build="$MINGW_CHOST" \
            --host="$MINGW_CHOST" \
            --prefix="$MINGW_PREFIX" \
            --sysconfdir="$MINGW_PREFIX/etc" \
            --enable-color \
            --enable-nanorc \
            --enable-utf8 \
            --enable-nls

          make -j"$(nproc)"

          # 最低限の非対話テスト
          ./src/nano.exe --version

          # DESTDIRへステージングする。
          # $MINGW_PREFIX はUCRT64では /ucrt64。
          make DESTDIR="$stage" install

          # Artifactのルートを、MSYS2の /ucrt64 に重ねられる構造にする。
          mkdir -p "$package"
          cp -a "$stage$MINGW_PREFIX/." "$package/"

          # サンプル設定は既存設定を上書きしない名前で格納する。
          install -Dm644 \
            doc/sample.nanorc \
            "$package/etc/nanorc.sample"

          {
            echo "GNU nano: $NANO_VERSION"
            echo "Target: $MINGW_CHOST"
            echo "Environment: MSYS2 UCRT64"
            echo "Source SHA-256: $NANO_SHA256"
            echo "Built at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            gcc --version | head -n 1
          } > "$package/BUILD-INFO.txt"

          # ステージング後の実行ファイルを検査する。
          "$package/bin/nano.exe" --version
          file "$package/bin/nano.exe"

          # 必要なDLL名をログへ出力する。
          objdump -p "$package/bin/nano.exe" \
            | sed -n 's/^[[:space:]]*DLL Name: //p' \
            | sort -u

      - name: Upload UCRT64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: nano-ucrt64-${{ env.NANO_VERSION }}

          path: nano-ucrt64-${{ env.NANO_VERSION }}
          if-no-files-found: error
          compression-level: 9
