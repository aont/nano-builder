name: Build and release GNU nano for MSYS2 UCRT64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-nano-ucrt64.yml"

# GitHub Releaseとタグの作成に必要。
permissions:
  contents: write

# 2つの実行が同じ次バージョンを採番しないよう、
# ブランチに関係なくリリース処理を直列化する。
concurrency:
  group: nano-ucrt64-release
  cancel-in-progress: false

env:
  NANO_VERSION: "9.2"
  NANO_SHA256: "05ecb99247b782e8a5b3a25ed4101dd034b0236902f7449bc9795b717642f7e9"

jobs:
  build-and-release:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            curl
            make
            patch
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-file

      - name: Determine next SemVer tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # refs/tags/X.Y.Z に完全一致するタグだけを対象にする。
          # prerelease、build metadata、v接頭辞付きタグは無視する。
          latest="$({
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" \
              --jq '.[].ref' 2>/dev/null || true
          } | sed -nE 's#^refs/tags/([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' \
            | sort -V \
            | tail -n 1)"

          if [[ -z "$latest" ]]; then
            next="0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="${major}.${minor}.$((10#$patch + 1))"
          fi

          echo "Previous tag: ${latest:-<none>}"
          echo "Next tag: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Download, build, and stage nano
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euxo pipefail

          root="$PWD"
          srcdir="$root/_source"
          stage="$root/_stage"
          package_name="nano-ucrt64-${NANO_VERSION}"
          package="$root/$package_name"
          archive="nano-${NANO_VERSION}.tar.xz"
          release_archive="$root/${package_name}-${RELEASE_TAG}.tar.xz"

          rm -rf "$srcdir" "$stage" "$package" "$release_archive"
          mkdir -p "$srcdir"
          cd "$srcdir"

          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://www.nano-editor.org/dist/v9/${archive}"

          printf '%s  %s\n' "$NANO_SHA256" "$archive" \
            | sha256sum --check --strict -

          tar -xf "$archive"
          cd "nano-${NANO_VERSION}"

          # nano 9.2 bundles a Gnulib dirent replacement on native Windows.
          # In that configuration DIR becomes struct gl_directory, but
          # rewinddir() remains the MinGW function accepting the native DIR.
          # Preserve the file browser by using a separate stream for pass 2.
          patch -p1 <<'PATCH'
          --- a/src/browser.c
          +++ b/src/browser.c
          @@ -47,6 +47,7 @@ void read_the_list(const char *path, DIR *dir)
           {
           	size_t path_len = strlen(path);
           	const struct dirent *entry;
          +	DIR *second_pass;
           	size_t widest = 0;
           	size_t index = 0;
           
          @@ -72,7 +73,7 @@ void read_the_list(const char *path, DIR *dir)
           	if (gauge > COLS)
           		gauge = COLS;
           
          -	rewinddir(dir);
          +	second_pass = opendir(path);
           
           	free_chararray(filelist, list_length);
           
          @@ -83,7 +84,8 @@ void read_the_list(const char *path, DIR *dir)
           
           	filelist = nmalloc(list_length * sizeof(char *));
           
          -	while ((entry = readdir(dir)) != NULL && index < list_length) {
          +	while (second_pass != NULL &&
          +			(entry = readdir(second_pass)) != NULL && index < list_length) {
           		/* Don't show the useless dot item. */
           		if (strcmp(entry->d_name, ".") == 0)
           			continue;
          @@ -95,6 +97,9 @@ void read_the_list(const char *path, DIR *dir)
           		index++;
           	}
           
          +	if (second_pass != NULL)
          +		closedir(second_pass);
          +
           	/* Maybe the number of files in the directory decreased between
           	 * the first time we scanned and the second time. */
           	list_length = index;
          PATCH

          ./configure \
            --build="$MINGW_CHOST" \
            --host="$MINGW_CHOST" \
            --prefix="$MINGW_PREFIX" \
            --sysconfdir="$MINGW_PREFIX/etc" \
            --enable-color \
            --enable-nanorc \
            --enable-utf8 \
            --enable-nls

          make -j"$(nproc)"
          ./src/nano.exe --version

          make DESTDIR="$stage" install

          mkdir -p "$package"
          cp -a "$stage$MINGW_PREFIX/." "$package/"
          install -Dm644 doc/sample.nanorc "$package/etc/nanorc.sample"

          {
            echo "GNU nano: $NANO_VERSION"
            echo "Release tag: $RELEASE_TAG"
            echo "Target: $MINGW_CHOST"
            echo "Environment: MSYS2 UCRT64"
            echo "Source SHA-256: $NANO_SHA256"
            echo "Source commit: $GITHUB_SHA"
            echo "Built at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            gcc --version | head -n 1
          } > "$package/BUILD-INFO.txt"

          "$package/bin/nano.exe" --version
          file "$package/bin/nano.exe"
          objdump -p "$package/bin/nano.exe" \
            | sed -n 's/^[[:space:]]*DLL Name: //p' \
            | sort -u

          cd "$root"
          tar -cJf "$release_archive" "$package_name"
          sha256sum "$release_archive" > "${release_archive}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nano-ucrt64-${{ env.NANO_VERSION }}-${{ steps.version.outputs.tag }}
          path: |
            nano-ucrt64-${{ env.NANO_VERSION }}-${{ steps.version.outputs.tag }}.tar.xz
            nano-ucrt64-${{ env.NANO_VERSION }}-${{ steps.version.outputs.tag }}.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euxo pipefail

          asset="nano-ucrt64-${NANO_VERSION}-${RELEASE_TAG}.tar.xz"

          # concurrencyで通常は衝突しないが、外部から同名タグが作成された場合は
          # 誤って上書きせず失敗させる。
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              >/dev/null 2>&1; then
            echo "Tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "$asset" \
            "${asset}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "GNU nano ${NANO_VERSION} built for MSYS2 UCRT64."
